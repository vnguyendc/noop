name: Strand
options:
  bundleIdPrefix: com.noopapp
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Base/development language. The in-source UI strings are authored in English (US);
  # the String Catalog (Strand/Resources/Localizable.xcstrings) carries this as the
  # source language and is where additional languages are added.
  developmentLanguage: en
# Signing defaults + optional git-ignored personal override (Config/Local.xcconfig). The
# DEVELOPMENT_TEAM / BUNDLE_ID_PREFIX / APP_GROUP_ID values live there, not in `settings`, because
# project-level settings here would override the xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "2.8.6"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Emit localizable strings so Xcode auto-extracts every LocalizedStringKey into the
    # String Catalog on build (the English (US) base entries).
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Build for both Apple Silicon and Intel so the release runs on every Mac.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Release:
      # Distribution builds must produce a universal binary, not just the host arch.
      ONLY_ACTIVE_ARCH: NO
packages:
  # Renders the Coach's LLM replies (GitHub-flavored Markdown — bold, lists,
  # headings, tables). Pinned exactly for reproducible community builds.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopStore:
    path: Packages/WhoopStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  StrandDesign:
    path: Packages/StrandDesign
schemes:
  NOOPiOS:
    build:
      targets:
        NOOPiOS: all
    run:
      config: Debug
    archive:
      config: Release
  NOOPiOSWidgets:
    build:
      targets:
        NOOPiOSWidgets: all
    run:
      config: Debug
    archive:
      config: Release
  NOOPWatch:
    build:
      targets:
        NOOPWatch: all
    run:
      config: Debug
    archive:
      config: Release
  NOOPWatchWidgets:
    build:
      targets:
        NOOPWatchWidgets: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  Strand:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
    info:
      path: Strand/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "94"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your Mac. Nothing leaves your device."
        # The AI Coach's "Custom (OpenAI-compatible)" provider talks to a LOCAL LLM server over plain
        # HTTP on loopback (Ollama / LM Studio / llama.cpp at http://localhost:…). ATS blocks cleartext
        # by default; NSAllowsLocalNetworking exempts loopback/.local/unqualified hosts ONLY — public
        # HTTPS endpoints are unaffected. No arbitrary-loads blanket exemption.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Strand/Resources/Strand.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        # Outbound client access — used ONLY by the opt-in, consent-gated, BYOK AI Coach.
        # The ad-hoc distributed build applies NO entitlements (unsigned build + ad-hoc
        # re-sign), so this matters only for a SIGNED/sandboxed build (where the sandbox
        # otherwise blocks the Coach's request — #128). Data path stays network-free.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.noop
        # The macOS app stays ad-hoc/unsigned even when Config/Local.xcconfig sets a team for the
        # iOS + watch targets, so a local personal override never changes how the Mac app is signed.
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: NOOP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Hardened Runtime closes the DYLD_INSERT_LIBRARIES injection vector for the
        # distributed (ad-hoc) build. The app uses no JIT / unsigned-exec memory, so it's safe.
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: MarkdownUI
  StrandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - StrandTests
    dependencies:
      - target: Strand
      - package: WhoopProtocol
      - package: WhoopStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.strandtests
        DEVELOPMENT_TEAM: ""

  NOOPiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StrandiOSSharedTests
      - StrandiOSShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.tests

  # ---------------------------------------------------------------------------
  # iOS app target (community build-from-source; never distributed via the App
  # Store — NOOP stays anonymous). Reuses the five shared packages + most of the
  # macOS app's Strand/ sources; the macOS-only scene/menu-bar/notification files
  # are excluded, and the iOS app shell + HealthKit + widgets/intents live under
  # StrandiOS/. See docs/IOS.md.
  NOOPiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
          - "Resources/Assets.xcassets"
          - "App/StrandApp.swift"
          - "App/RootView.swift"
          # ContentView embeds RootView() (the macOS NavigationSplitView sidebar shell), which is
          # excluded above — so ContentView cannot compile on iOS. The iOS shell is RootTabView,
          # wired in StrandiOS/App/StrandiOSApp.swift (which reproduces ContentView's onboarding/
          # Terms/What's-New gates around the TabView). Without this exclude the iOS target fails to
          # resolve RootView().
          - "App/ContentView.swift"
          - "MenuBar"
          - "Data/NotificationSettingsStore.swift"
          - "Screens/NotificationSettingsView.swift"
          # macOS-only AppIntents (BuzzStrap/MarkMoment) — iOS uses StrandiOS/System/NOOPAppIntents.swift.
          # Without this exclude both compile into the iOS target and collide on NOOPAppIntents.stringsdata.
          - "System/NOOPAppIntents.swift"
      - path: StrandiOS
        excludes:
          - "Resources/Info.plist"
          - "Resources/NOOP.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandiOS/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your iPhone. Nothing leaves your device."
        NSHealthShareUsageDescription: "NOOP reads your own Apple Health data on-device to compute recovery, strain, and sleep. Nothing leaves your device."
        NSHealthUpdateUsageDescription: "NOOP writes the metrics it computes from your strap back into Apple Health, on-device and only when you allow it."
        # #187: the opt-in AI Coach's "Custom (OpenAI-compatible)" provider can point at a LOCAL LLM on
        # the LAN (Ollama / LM Studio at http://192.168.x.x:11434). ATS blocks cleartext by default;
        # NSAllowsLocalNetworking exempts loopback/.local/private-LAN hosts ONLY — public HTTPS endpoints
        # are unaffected, so cloud providers stay TLS. Mirrors the macOS target.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # #155: expose the app's Documents folder to Files/Shortcuts so the user's Siri Shortcut can
        # read the opt-in noop_sync.txt drop file (Apple-Health-free export for sideloaded installs).
        # Both keys are required for the folder to actually appear in Files.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Expanded App Group id, read at runtime by AppGroupID (StrandiOSShared).
        NOOPAppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: StrandiOS/Resources/NOOP.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        CURRENT_PROJECT_VERSION: "49"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop
        PRODUCT_NAME: NOOP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: MarkdownUI
      - target: NOOPiOSWidgets
      - target: NOOPWatch

  # WidgetKit + Live Activity extension — the iOS analogue of the macOS menu-bar
  # extra. Reads a tiny snapshot the app publishes into the shared App Group.
  NOOPiOSWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StrandiOSWidgets
        excludes:
          - "Info.plist"
          - "NOOPWidgets.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandiOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: NOOP
        NOOPAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StrandiOSWidgets/NOOPWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.widgets
        PRODUCT_NAME: NOOPWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: StrandDesign

  NOOPWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StrandWatch
        excludes:
          - "Resources/NOOPWatch.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandWatch/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).noop
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP or heart-rate strap over Bluetooth to show live heart rate, R-R intervals, and battery on your Apple Watch. Nothing leaves your device."
        # Workout mode: a running HKWorkoutSession is what keeps the watch app (and its Bluetooth
        # link to the strap) alive with the wrist down. NOOP saves nothing to Health from the watch.
        NSHealthShareUsageDescription: "NOOP starts a workout session so your Apple Watch can keep reading your strap with your wrist down. Nothing leaves your device."
        NSHealthUpdateUsageDescription: "NOOP needs workout permission to keep a workout session running while it reads your strap. It does not save workouts from the watch."
        WKBackgroundModes:
          - workout-processing
        NOOPWatchAppGroupID: $(WATCH_APP_GROUP_ID)
    entitlements:
      path: StrandWatch/Resources/NOOPWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(WATCH_APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.watchkitapp
        PRODUCT_NAME: NOOPWatch
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: WhoopProtocol
      - target: NOOPWatchWidgets

  NOOPWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StrandWatchWidgets
        excludes:
          - "NOOPWatchWidgets.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NOOPWatchAppGroupID: $(WATCH_APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StrandWatchWidgets/NOOPWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WATCH_APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.watchkitapp.widgets
        PRODUCT_NAME: NOOPWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
